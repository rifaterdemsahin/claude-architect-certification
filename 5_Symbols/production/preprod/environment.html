<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loaded Environment Values | Claude AI Certification</title>
  <meta name="description" content="Diagnostic view of the environment values loaded by the Go server at runtime (secrets masked). Resolved from .env / Azure Key Vault.">
  <link rel="icon" type="image/png" href="../../../favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Outfit:wght@300;400;600;800&family=Plus+Jakarta+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #030712; --bg-card: rgba(17,24,39,0.85); --text-main: #f3f4f6; --text-muted: #9ca3af;
      --primary: #8b5cf6; --secondary: #3b82f6; --accent: #f59e0b; --success: #10b981; --danger: #ef4444;
      --font-title: 'Outfit', sans-serif; --font-body: 'Plus Jakarta Sans', sans-serif; --font-mono: 'Fira Code', monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-dark);
      background-image: radial-gradient(circle at 10% 20%, rgba(139,92,246,0.08) 0%, transparent 40%), radial-gradient(circle at 90% 80%, rgba(59,130,246,0.08) 0%, transparent 40%);
      color: var(--text-main); font-family: var(--font-body); line-height: 1.6; min-height: 100vh; padding: 40px 20px;
    }
    .container { max-width: 1000px; margin: 0 auto; }
    header { text-align: center; margin-bottom: 32px; }
    header h1 { font-family: var(--font-title); font-size: 2.2rem; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 8px; }
    header p { color: var(--text-muted); }
    .glass-card { background: var(--bg-card); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 24px; margin-bottom: 24px; box-shadow: 0 20px 40px -10px rgba(0,0,0,0.6); }
    .status-row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; margin-bottom: 20px; }
    .pill { display: inline-flex; align-items: center; gap: 8px; padding: 8px 16px; border-radius: 20px; font-size: 0.85rem; font-weight: 600; border: 1px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.05); }
    .pill .dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
    .group-title { font-family: var(--font-title); font-size: 1.05rem; font-weight: 700; margin: 22px 0 10px; color: var(--accent); }
    table { width: 100%; border-collapse: separate; border-spacing: 0 6px; }
    th { text-align: left; color: var(--text-muted); font-size: 0.78rem; font-weight: 600; padding: 6px 12px; text-transform: uppercase; letter-spacing: 0.04em; }
    td { padding: 12px; background: rgba(0,0,0,0.18); vertical-align: top; font-size: 0.9rem; }
    tr td:first-child { border-radius: 10px 0 0 10px; }
    tr td:last-child { border-radius: 0 10px 10px 0; }
    .key { font-family: var(--font-mono); color: var(--text-main); font-size: 0.85rem; }
    .val { font-family: var(--font-mono); color: var(--text-muted); font-size: 0.82rem; word-break: break-all; }
    .badge { display: inline-block; padding: 2px 10px; border-radius: 20px; font-size: 0.72rem; font-weight: 700; }
    .badge-set { background: rgba(16,185,129,0.18); color: #34d399; border: 1px solid rgba(16,185,129,0.3); }
    .badge-unset { background: rgba(239,68,68,0.16); color: #f87171; border: 1px solid rgba(239,68,68,0.3); }
    .badge-secret { background: rgba(245,158,11,0.16); color: #fbbf24; border: 1px solid rgba(245,158,11,0.3); margin-left: 6px; }
    .note { color: var(--text-muted); font-size: 0.75rem; font-style: italic; margin-top: 2px; }
    .toolbar { display: flex; gap: 10px; justify-content: flex-end; margin-bottom: 16px; }
    .btn { background: var(--accent); color: #000; border: none; border-radius: 10px; padding: 9px 18px; font-weight: 700; font-size: 0.85rem; cursor: pointer; }
    .btn-secondary { background: rgba(255,255,255,0.1); color: var(--text-main); }
    .empty-state { text-align: center; padding: 40px 20px; color: var(--text-muted); }
    .empty-state .icon { font-size: 2.6rem; margin-bottom: 10px; }
    .warn { color: #fbbf24; }
    footer { text-align: center; margin-top: 24px; }
    footer a { color: var(--secondary); text-decoration: none; }
  </style>
  <script src="../../../shared/schema-modal.js"></script>
  <script src="../../../shared/nav.js"></script>
  <script src="../../../shared/seo.js" defer></script>
</head>
<body>
  <div class="container">
    <header>
      <h1>🌍 Loaded Environment Values</h1>
      <p>What the Go server actually loaded at runtime — from <code>.env</code> or Azure Key Vault. 🔐 Secrets are masked.</p>
    </header>

    <div class="glass-card">
      <div class="toolbar">
        <button class="btn btn-secondary" id="reloadBtn">🔄 Reload</button>
      </div>
      <div class="status-row" id="statusRow"></div>
      <div id="report">
        <div class="empty-state"><div class="icon">⏳</div><p>Loading environment values…</p></div>
      </div>
    </div>

    <footer>
      <p><a href="index.html">← Back to Pre-Production</a></p>
    </footer>
  </div>

  <script src="../../../shared/debug-panel.js"></script>
  <script>
    const $ = id => document.getElementById(id);

    function escHtml(s) {
      return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function pill(label, color) {
      return `<span class="pill"><span class="dot" style="background:${color}"></span>${escHtml(label)}</span>`;
    }

    function renderEntries(entries, keyVaultActive) {
      const statusRow = $('statusRow');
      const setCount = entries.filter(e => e.set).length;
      statusRow.innerHTML =
        pill(`${setCount}/${entries.length} values loaded`, setCount === entries.length ? 'var(--success)' : 'var(--accent)') +
        pill(keyVaultActive ? 'Azure Key Vault active' : 'Key Vault inactive (using .env)', keyVaultActive ? 'var(--secondary)' : 'var(--text-muted)');

      // Group by entry.group, preserving first-seen order.
      const groups = [];
      const byGroup = {};
      entries.forEach(e => {
        if (!byGroup[e.group]) { byGroup[e.group] = []; groups.push(e.group); }
        byGroup[e.group].push(e);
      });

      let html = '';
      groups.forEach(g => {
        html += `<div class="group-title">${escHtml(g)}</div>`;
        html += '<table><thead><tr><th style="width:38%">Variable</th><th style="width:18%">Status</th><th>Loaded value</th></tr></thead><tbody>';
        byGroup[g].forEach(e => {
          const status = e.set
            ? '<span class="badge badge-set">SET</span>'
            : '<span class="badge badge-unset">NOT SET</span>';
          const secretTag = e.secret ? '<span class="badge badge-secret">🔐 secret</span>' : '';
          const value = e.set ? `<span class="val">${escHtml(e.value)}</span>` : '<span class="val warn">— empty —</span>';
          const note = e.note ? `<div class="note">${escHtml(e.note)}</div>` : '';
          html += `<tr>
            <td class="key">${escHtml(e.key)}${secretTag}</td>
            <td>${status}</td>
            <td>${value}${note}</td>
          </tr>`;
        });
        html += '</tbody></table>';
      });
      $('report').innerHTML = html;
    }

    // Public fallback — when /api/env-status is not authorized, show whatever the
    // public /api/config exposes so the page is still useful off-localhost.
    function renderPublicFallback(cfg, reason) {
      const entries = [
        { key: 'SUPABASE_URL', group: 'Supabase (public /api/config)', set: !!cfg.supabaseUrl, secret: false, value: cfg.supabaseUrl || '', note: '' },
        { key: 'SUPABASE_ANON_KEY', group: 'Supabase (public /api/config)', set: !!cfg.supabaseAnon, secret: true, value: cfg.supabaseAnon ? '•••• (loaded)' : '', note: '' },
        { key: 'AZURE_STORAGE (account name)', group: 'Azure (public /api/config)', set: !!cfg.azureAccountName, secret: false, value: cfg.azureAccountName || '', note: '' },
        { key: 'GOOGLE_CLIENT_ID', group: 'Google (public /api/config)', set: !!cfg.googleClientId, secret: false, value: cfg.googleClientId || '', note: 'OAuth client ID' }
      ];
      $('statusRow').innerHTML = pill('Limited view — ' + reason, 'var(--accent)');
      renderEntries(entries, false);
      const banner = document.createElement('div');
      banner.className = 'note warn';
      banner.style.marginTop = '12px';
      banner.innerHTML = '⚠️ Full environment status requires an admin session or localhost. Showing only the public <code>/api/config</code> values.';
      $('report').appendChild(banner);
    }

    async function load() {
      $('report').innerHTML = '<div class="empty-state"><div class="icon">⏳</div><p>Loading environment values…</p></div>';
      $('statusRow').innerHTML = '';
      try {
        const res = await fetch('/api/env-status', { credentials: 'same-origin' });
        if (res.status === 401) {
          const cfg = await fetch('/api/config').then(r => r.json()).catch(() => ({}));
          renderPublicFallback(cfg, 'admin/localhost required');
          return;
        }
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        renderEntries(data.entries || [], !!data.keyVaultActive);
      } catch (e) {
        try {
          const cfg = await fetch('/api/config').then(r => r.json());
          renderPublicFallback(cfg, 'server status unavailable');
        } catch (_) {
          $('report').innerHTML = `<div class="empty-state"><div class="icon">💥</div><p>Could not load environment values: ${escHtml(e.message)}</p><p style="font-size:0.85rem;margin-top:8px;">Is the Go server running? Static hosting (GitHub Pages) has no <code>/api</code> backend.</p></div>`;
        }
      }
    }

    $('reloadBtn').addEventListener('click', load);
    load();
  </script>
</body>
</html>
