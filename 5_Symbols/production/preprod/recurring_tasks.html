<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🔁 Recurring Tasks</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Plus+Jakarta+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #030712; --card: rgba(17,24,39,0.9); --border: rgba(139,92,246,0.2);
      --text: #f3f4f6; --muted: #9ca3af; --primary: #8b5cf6; --green: #10b981;
      --red: #ef4444; --yellow: #f59e0b; --font-h: 'Outfit', sans-serif;
      --font-b: 'Plus Jakarta Sans', sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: var(--font-b); line-height: 1.6; padding: 32px 24px 100px; }
    .container { max-width: 860px; margin: 0 auto; }
    h1 { font-family: var(--font-h); font-size: 2.4rem; font-weight: 800; margin-bottom: 6px; }
    .subtitle { color: var(--muted); font-size: 1rem; margin-bottom: 28px; }

    .task-card {
      background: var(--card); border: 1px solid var(--border); border-radius: 16px;
      padding: 18px 22px; margin-bottom: 14px; display: flex; align-items: flex-start; gap: 14px;
    }
    .task-check { margin-top: 5px; width: 18px; height: 18px; accent-color: var(--primary); cursor: pointer; flex-shrink: 0; }
    .task-body { flex: 1; min-width: 0; }
    .task-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 4px; }
    .task-name { font-family: var(--font-h); font-size: 1.05rem; font-weight: 700; }
    .task-name.checked { text-decoration: line-through; color: var(--muted); }
    .freq-badge {
      background: rgba(139,92,246,0.15); color: #c4b5fd; border: 1px solid rgba(139,92,246,0.3);
      border-radius: 8px; padding: 2px 10px; font-size: 0.72rem; font-weight: 700; white-space: nowrap;
    }
    .task-desc { font-size: 0.85rem; color: var(--muted); margin-bottom: 8px; }
    .task-link {
      display: inline-block; font-size: 0.82rem; font-weight: 700; color: #c4b5fd;
      text-decoration: none; border: 1px solid rgba(139,92,246,0.35); border-radius: 8px;
      padding: 5px 12px; transition: all 0.2s;
    }
    .task-link:hover { background: rgba(139,92,246,0.12); }
    .last-done { font-size: 0.75rem; color: var(--muted); margin-top: 6px; }
  </style>
  <script src="../../../shared/nav.js" defer></script>
<script src="../../../shared/seo.js" defer></script></head>
<body>
<div class="container">
  <h1>🔁 Recurring Tasks</h1>
  <p class="subtitle">Ongoing activities that repeat on a fixed cadence — not one-off pre-production steps. Check off each cycle; state is saved locally per browser.</p>

  <div id="tasks"></div>
</div>

<script>
const TASKS = [
  {
    id: 'linkedin-newsletter',
    name: '📰 Publish LinkedIn Newsletter',
    freq: 'Weekly',
    desc: 'Write and publish this week\'s issue of the LinkedIn newsletter.',
    link: 'https://www.linkedin.com/newsletters/7490354292390940672/'
  }
];

function loadState() {
  try {
    return JSON.parse(localStorage.getItem('recurring_tasks_state') || '{}');
  } catch (e) {
    return {};
  }
}

function saveState(state) {
  localStorage.setItem('recurring_tasks_state', JSON.stringify(state));
}

function render() {
  const state = loadState();
  const container = document.getElementById('tasks');
  container.innerHTML = TASKS.map(t => {
    const entry = state[t.id] || {};
    const lastDone = entry.lastCompleted ? new Date(entry.lastCompleted).toLocaleString() : 'Not yet completed';
    return `<div class="task-card">
      <input type="checkbox" class="task-check" ${entry.checked ? 'checked' : ''} onchange="toggle('${t.id}', this.checked)">
      <div class="task-body">
        <div class="task-top">
          <span class="task-name${entry.checked ? ' checked' : ''}" id="name-${t.id}">${t.name}</span>
          <span class="freq-badge">${t.freq}</span>
        </div>
        <div class="task-desc">${t.desc}</div>
        <a class="task-link" href="${t.link}" target="_blank" rel="noopener">🔗 Open</a>
        <div class="last-done" id="last-${t.id}">Last completed: ${lastDone}</div>
      </div>
    </div>`;
  }).join('');
}

function toggle(id, checked) {
  const state = loadState();
  const entry = state[id] || {};
  entry.checked = checked;
  if (checked) entry.lastCompleted = Date.now();
  state[id] = entry;
  saveState(state);
  document.getElementById('name-' + id).classList.toggle('checked', checked);
  document.getElementById('last-' + id).textContent = 'Last completed: ' + (entry.lastCompleted ? new Date(entry.lastCompleted).toLocaleString() : 'Not yet completed');
}

document.addEventListener('DOMContentLoaded', render);
</script>
<script src="../../../shared/debug-panel.js"></script>
</body>
</html>
