    {n:'id',t:'SERIAL',pk:true},{n:'entity_type',t:'TEXT'},{n:'entity_id',t:'TEXT'},{n:'explanation_text',t:'TEXT'},{n:'generated_by',t:'TEXT'},{n:'created_at',t:'TIMESTAMPTZ'},{n:'updated_at',t:'TIMESTAMPTZ'}
  ]},

  // IVQ
  { group:'IVQ',                          icon:'❓', name:'ivq_questions', columns:[
    {n:'id',t:'BIGSERIAL',pk:true},{n:'video_id',t:'BIGINT',fk:'videos'},{n:'question_text',t:'TEXT'},{n:'options',t:'JSONB'},{n:'correct_option',t:'TEXT'},{n:'explanation',t:'TEXT'},{n:'incorrect_explanations',t:'JSONB'},{n:'timestamp_seconds',t:'INT'},{n:'sort_order',t:'INT'},{n:'created_at',t:'TIMESTAMPTZ'}
  ], note:'Shares the videos table, but the IVQ migration expects a different videos shape; only ivq_questions is unique.'},

  // Navigation
  { group:'Navigation',                   icon:'⭐', name:'nav_favorites', columns:[
    {n:'url',t:'TEXT',pk:true},{n:'label',t:'TEXT'},{n:'created_at',t:'TIMESTAMPTZ'}
  ]}
];

// Initialize cytoscape
let cy;

document.addEventListener('DOMContentLoaded', () => {
  const elements = [];
  
  // Add nodes (tables)
  TABLES.forEach(table => {
    elements.push({
      data: { 
        id: table.name, 
        label: `${table.icon} ${table.name}`,
        group: table.group
      }
    });
  });
  
  // Add edges (foreign keys)
  TABLES.forEach(table => {
    table.columns.forEach(col => {
      if (col.fk) {
        elements.push({
          data: {
            id: `${table.name}-${col.fk}`,
            source: table.name,
            target: col.fk,
            label: col.n
          }
        });
      }
    });
  });

  cy = cytoscape({
    container: document.getElementById('cy'),
    elements: elements,
    style: [
      {
        selector: 'node',
        style: {
          'background-color': '#1f2937',
          'border-width': 2,
          'border-color': '#8b5cf6',
          'label': 'data(label)',
          'color': '#f3f4f6',
          'font-family': 'Fira Mono, monospace',
          'font-size': '12px',
          'text-valign': 'center',
          'text-halign': 'center',
          'shape': 'round-rectangle',
          'width': 'label',
          'height': 'label',
          'padding': '12px'
        }
      },
      {
        selector: 'edge',
        style: {
          'width': 2,
          'line-color': '#4b5563',
          'target-arrow-color': '#3b82f6',
          'target-arrow-shape': 'triangle',
          'curve-style': 'bezier',
          'label': 'data(label)',
          'font-size': '10px',
          'color': '#9ca3af',
          'text-background-color': '#030712',
          'text-background-opacity': 0.8,
          'text-background-padding': '4px',
          'text-background-shape': 'round-rectangle'
        }
      }
    ],
    layout: {
      name: 'dagre',
      rankDir: 'LR',
      padding: 50
    }
  });

  // Highlight connections on tap
  cy.on('tap', 'node', function(evt){
    const node = evt.target;
    const connectedEdges = node.connectedEdges();
    
    // Reset all
    cy.elements().style({ 'opacity': 0.2 });
    
    // Highlight connected
    node.style({ 'opacity': 1 });
    connectedEdges.style({ 'opacity': 1 });
    connectedEdges.connectedNodes().style({ 'opacity': 1 });
  });

  // Reset highlight on tapping background
  cy.on('tap', function(evt){
    if(evt.target === cy){
      cy.elements().style({ 'opacity': 1 });
    }
  });
});

function layoutGraph(name) {
  let options = { name: name, animate: true, animationDuration: 500 };
  if (name === 'dagre') {
    options.rankDir = 'LR';
  }
  cy.layout(options).run();
}

function resetZoom() {
  cy.fit(cy.elements(), 50);
}
</script>
