<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="../../../shared/redirect-to-live-site.js"></script>
  <title>AI Script & Prompt Generation | Claude AI Certification</title>
  <meta name="description" content="Track LLM-generated sentences from source blueprints — model, source, prompt, output, and status, saved to Supabase.">
  <link rel="icon" type="image/png" href="../../../favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark:#030712; --bg-card:rgba(17,24,39,0.9); --text-main:#f3f4f6; --text-muted:#9ca3af;
      --font-title:'Outfit',sans-serif; --font-body:'Plus Jakarta Sans',sans-serif;
    }
    * { box-sizing:border-box; margin:0; padding:0; }
    body {
      background-color:var(--bg-dark);
      background-image: radial-gradient(circle at 12% 18%, #f59e0b14 0%, transparent 42%),
                        radial-gradient(circle at 88% 82%, rgba(139,92,246,0.08) 0%, transparent 42%);
      color:var(--text-main); font-family:var(--font-body); line-height:1.6; padding:100px 24px 60px;
    }
    .container { max-width:1100px; margin:0 auto; }
    header { text-align:center; margin-bottom:40px; }
    .badge { display:inline-block; padding:5px 14px; background:#f59e0b22; border:1px solid #f59e0b44;
      border-radius:100px; font-size:0.75rem; font-weight:700; color:#f59e0b; text-transform:uppercase;
      letter-spacing:0.08em; margin-bottom:14px; }
    header h1 { font-family:var(--font-title); font-size:2.4rem; font-weight:900; margin-bottom:10px; }
    header p { color:var(--text-muted); max-width:700px; margin:0 auto; font-size:1.02rem; }
    footer { text-align:center; margin-top:48px; padding-top:20px; border-top:1px solid rgba(255,255,255,0.05); }
    footer a { color:#3b82f6; text-decoration:none; }
  </style>
  <script src="../../../shared/nav.js"></script>
  <script src="../../../shared/debug-panel.js"></script>
  <script src="../../../shared/seo.js" defer></script>
</head>
<body>
  <div class="container">
    <header>
      <div class="badge">AI Production · Script Gen</div>
      <h1>✍️ AI Script & Prompt Engineering</h1>
      <p>Capture the provenance of each sentence: the raw architecture/docs it came from, the LLM and prompt used to expand it, and the generated text. Records how the structured master-prompt sentences were produced.</p>
    </header>

    <div id="aiTracker"></div>

    <footer>
      <p><a href="index.html">← Back to Post-Production</a></p>
    </footer>
  </div>

  <script src="../../../shared/postprod-guide.js"></script>
  <script>
    PostprodGuide.render({
      title: 'AI Script & Prompt Generation',
      accent: '#f59e0b',
      intro: 'This page captures the provenance of each script sentence — which LLM, which prompt, and which source produced it.',
      steps: [
        'Select a Module and Video to load its sentences.',
        'For each sentence, record the LLM Model used (e.g. claude-opus-4-8) and the Source Blueprint / Docs it was expanded from.',
        'Paste the exact Prompt Used and the Generated / Refined Text that resulted.',
        'Set Status to "completed" and add a Rationale for any rewrite or skip.',
        'Every field autosaves to ai_script_generations — giving you a reproducible audit trail per sentence.'
      ],
      note: 'This is the provenance log behind the script — fill it as you draft so each line is reproducible.'
    });
  </script>
  <script src="../../../shared/ai-sentence-tracker.js"></script>
  <script>
    AISentenceTracker.init({
      mount:'#aiTracker', table:'ai_script_generations', conflictKeys:['sentence_id'], accent:'#f59e0b',
      fields:[
        { key:'generation_status', label:'Status', type:'select', options:['pending','generating','completed','skipped','failed'] },
        { key:'llm_model', label:'LLM Model', type:'text', placeholder:'claude-opus-4-8' },
        { key:'source_blueprint', label:'Source Blueprint / Docs', type:'textarea', full:true, placeholder:'Raw architectural input this sentence was expanded from' },
        { key:'prompt_used', label:'Prompt Used', type:'textarea', full:true, placeholder:'Prompt-engineering instruction' },
        { key:'generated_text', label:'Generated / Refined Text', type:'textarea', full:true, placeholder:'Resulting sentence text' },
        { key:'rationale', label:'Rationale (why this choice / why skipped)', type:'textarea', full:true, placeholder:'Notes for the editor' },
      ],
    });
  </script>
</body>
</html>
