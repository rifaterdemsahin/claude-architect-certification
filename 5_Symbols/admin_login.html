<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Sign In</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;800&family=Plus+Jakarta+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #030712; --card: rgba(17,24,39,0.9); --text: #f3f4f6; --muted: #9ca3af; --primary: #8b5cf6; --success: #10b981; --danger: #ef4444; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: 'Plus Jakarta Sans', sans-serif; padding: 120px 40px 40px; line-height: 1.6; display: flex; justify-content: center; }
    .container { max-width: 400px; width: 100%; }
    h1 { font-family: 'Outfit', sans-serif; font-size: 2rem; margin-bottom: 10px; text-align: center; }
    p { color: var(--muted); margin-bottom: 24px; text-align: center; }
    .card { background: var(--card); border: 1px solid rgba(255,255,255,0.06); border-radius: 20px; padding: 32px; }
    label { display: block; font-weight: 700; margin-bottom: 8px; font-size: 0.95rem; }
    input { width: 100%; padding: 14px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.3); color: white; font-size: 1rem; margin-bottom: 20px; }
    input:focus { outline: none; border-color: var(--primary); }
    .btn { width: 100%; padding: 14px; border-radius: 10px; font-weight: 700; border: none; cursor: pointer; font-size: 1rem; transition: all 0.2s; font-family: inherit; }
    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover { background: #7c3aed; }
    .status-badge { display: block; text-align: center; margin-top: 16px; padding: 8px; border-radius: 10px; font-size: 0.9rem; font-weight: 700; }
    .status-ready { background: rgba(16,185,129,0.15); color: var(--success); }
    .status-pending { background: rgba(245,158,11,0.15); color: #f59e0b; }
    .status-error { background: rgba(239,68,68,0.15); color: var(--danger); }
  </style>
  <script src="../shared/nav.js"></script>
  <script src="../shared/seo.js" defer></script>
</head>
<body>
  <div class="container">
    <h1>🔑 Admin Sign In</h1>
    <p>Sign in with the admin password to unlock destructive actions.</p>
    
    <div class="card" id="admin-auth-card">
      <label for="admin-password">Admin Password</label>
      <input id="admin-password" type="password" placeholder="Enter admin password..." onkeydown="if(event.key === 'Enter') loginAdmin()">
      <button class="btn btn-primary" id="btn-admin-login" onclick="loginAdmin()">Sign In</button>
      <span id="admin-auth-status" class="status-badge" style="display: none;"></span>
    </div>
  </div>

  <script>
    function getCookie(name) {
      const m = document.cookie.match(new RegExp('(?:^|; )' + name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '=([^;]*)'));
      return m ? decodeURIComponent(m[1]) : null;
    }

    async function checkAdminAuth() {
      const statusEl = document.getElementById('admin-auth-status');
      const adminCookie = getCookie('admin_logged_in');
      if (adminCookie === 'true') {
        statusEl.style.display = 'block';
        statusEl.className = 'status-badge status-ready';
        statusEl.textContent = 'Already authorized. Redirecting...';
        redirectBack();
      }
    }

    function redirectBack() {
      const urlParams = new URLSearchParams(window.location.search);
      const redirect = urlParams.get('redirect');
      if (redirect) {
        window.location.href = '/' + redirect;
      } else {
        window.location.href = '/index.html';
      }
    }

    async function loginAdmin() {
      const password = document.getElementById('admin-password').value.trim();
      const statusEl = document.getElementById('admin-auth-status');
      if (!password) return;

      statusEl.style.display = 'block';
      statusEl.className = 'status-badge status-pending';
      statusEl.textContent = 'Signing in...';

      try {
        const res = await fetch((window.API_BASE || '') + '/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password })
        });
        const data = await res.json();
        if (res.ok && data.success) {
          statusEl.className = 'status-badge status-ready';
          statusEl.textContent = 'Authorized! Redirecting...';
          
          if (window.SiteAuth && typeof window.applyAdminStatus === 'function') {
             window.applyAdminStatus(true);
          }
          
          setTimeout(redirectBack, 500);
        } else {
          statusEl.className = 'status-badge status-error';
          statusEl.textContent = data.error || 'Login failed';
        }
      } catch (err) {
        statusEl.className = 'status-badge status-error';
        statusEl.textContent = 'Connection error';
      }
    }

    checkAdminAuth();
  </script>
</body>
</html>
