<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Sign In - Premium Authentication</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;800&family=Plus+Jakarta+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #030712;
      --card-bg: rgba(17, 24, 39, 0.6);
      --card-border: rgba(255, 255, 255, 0.08);
      --text-main: #f9fafb;
      --text-muted: #9ca3af;
      --primary: #8b5cf6;
      --primary-hover: #7c3aed;
      --accent: #ec4899;
      --success: #10b981;
      --danger: #ef4444;
      --focus-ring: rgba(139, 92, 246, 0.4);
    }
    
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body { 
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 15% 50%, rgba(139, 92, 246, 0.15), transparent 25%),
        radial-gradient(circle at 85% 30%, rgba(236, 72, 153, 0.15), transparent 25%);
      color: var(--text-main); 
      font-family: 'Plus Jakarta Sans', sans-serif; 
      min-height: 100vh; 
      display: flex; 
      flex-direction: column;
      margin: 0;
      padding: 0;
      line-height: 1.6;
    }

    .content-container {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
      position: relative;
    }

    .background-shapes {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      z-index: -1;
      overflow: hidden;
      pointer-events: none;
    }

    .shape {
      position: absolute;
      filter: blur(80px);
      opacity: 0.5;
      border-radius: 50%;
      animation: float 10s infinite ease-in-out alternate;
    }

    .shape-1 {
      background: var(--primary);
      width: 300px; height: 300px;
      top: -100px; left: -100px;
    }

    .shape-2 {
      background: var(--accent);
      width: 250px; height: 250px;
      bottom: -100px; right: -50px;
      animation-delay: -5s;
    }

    @keyframes float {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(30px, 50px) scale(1.1); }
    }

    .container { 
      max-width: 420px; 
      width: 100%; 
      position: relative;
      z-index: 1;
      animation: slideUpFade 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes slideUpFade {
      0% { opacity: 0; transform: translateY(20px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    .header-content {
      text-align: center;
      margin-bottom: 32px;
    }

    .icon-wrapper {
      width: 64px;
      height: 64px;
      margin: 0 auto 16px;
      background: linear-gradient(135deg, rgba(139, 92, 246, 0.2), rgba(236, 72, 153, 0.2));
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
    }

    h1 { 
      font-family: 'Outfit', sans-serif; 
      font-size: clamp(1.75rem, 5vw, 2.25rem); 
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
      background: linear-gradient(to right, #fff, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p { 
      color: var(--text-muted); 
      font-size: 0.95rem;
      max-width: 300px;
      margin: 0 auto;
    }

    .card { 
      background: var(--card-bg); 
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border); 
      border-radius: 24px; 
      padding: clamp(24px, 5vw, 40px);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .card:hover {
      border-color: rgba(255, 255, 255, 0.15);
      box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.6);
    }

    .input-group {
      margin-bottom: 24px;
      text-align: left;
    }

    label { 
      display: block; 
      font-weight: 700; 
      margin-bottom: 10px; 
      font-size: 0.9rem; 
      color: #e5e7eb;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }

    .input-wrapper {
      position: relative;
    }

    input { 
      width: 100%; 
      padding: 16px; 
      border-radius: 12px; 
      border: 1px solid rgba(255, 255, 255, 0.12); 
      background: rgba(0, 0, 0, 0.4); 
      color: white; 
      font-size: 1rem; 
      transition: all 0.3s ease;
      font-family: inherit;
    }
    
    input::placeholder {
      color: rgba(255, 255, 255, 0.3);
    }

    input:focus { 
      outline: none; 
      border-color: var(--primary); 
      background: rgba(0, 0, 0, 0.6);
      box-shadow: 0 0 0 4px var(--focus-ring);
    }

    .btn { 
      width: 100%; 
      padding: 16px; 
      border-radius: 12px; 
      font-weight: 700; 
      border: none; 
      cursor: pointer; 
      font-size: 1.05rem; 
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
      font-family: 'Outfit', sans-serif;
      letter-spacing: 0.02em;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-primary { 
      background: linear-gradient(135deg, var(--primary), var(--accent)); 
      color: white; 
      box-shadow: 0 4px 14px 0 rgba(139, 92, 246, 0.39);
    }
    
    .btn-primary::before {
      content: '';
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(135deg, var(--accent), var(--primary));
      opacity: 0;
      transition: opacity 0.3s ease;
      z-index: 1;
    }

    .btn-primary span {
      position: relative;
      z-index: 2;
    }

    .btn-primary:hover { 
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(139, 92, 246, 0.6);
    }

    .btn-primary:hover::before {
      opacity: 1;
    }

    .btn-primary:active {
      transform: translateY(1px);
    }

    .status-badge { 
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 20px; 
      padding: 12px; 
      border-radius: 12px; 
      font-size: 0.9rem; 
      font-weight: 600;
      animation: fadeIn 0.3s ease forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .status-ready { background: rgba(16,185,129,0.15); color: var(--success); border: 1px solid rgba(16,185,129,0.3); }
    .status-pending { background: rgba(245,158,11,0.15); color: #f59e0b; border: 1px solid rgba(245,158,11,0.3); }
    .status-error { background: rgba(239,68,68,0.15); color: var(--danger); border: 1px solid rgba(239,68,68,0.3); }
    
    .loader {
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top: 2px solid white;
      width: 16px;
      height: 16px;
      animation: spin 1s linear infinite;
      display: none;
    }
    
    .btn-loading .loader {
      display: block;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
  <script src="../shared/nav.js"></script>
  <script src="../shared/seo.js" defer></script>
</head>
<body>
  <div class="background-shapes">
    <div class="shape shape-1"></div>
    <div class="shape shape-2"></div>
  </div>

  <main class="content-container">
    <div class="container">
      <div class="header-content">
        <div class="icon-wrapper">🛡️</div>
        <h1>Admin Portal</h1>
        <p>Authenticate to securely access system management and configuration.</p>
      </div>
      
      <div class="card" id="admin-auth-card">
        <div class="input-group">
          <label for="admin-password">Admin Password</label>
          <div class="input-wrapper">
            <input id="admin-password" type="password" placeholder="••••••••••••" onkeydown="if(event.key === 'Enter') loginAdmin()">
          </div>
        </div>
        
        <button class="btn btn-primary" id="btn-admin-login" onclick="loginAdmin()">
          <span>Sign In</span>
          <div class="loader"></div>
        </button>
        
        <div id="admin-auth-status" class="status-badge" style="display: none;"></div>
      </div>
    </div>
  </main>

  <script>
    function getCookie(name) {
      const m = document.cookie.match(new RegExp('(?:^|; )' + name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '=([^;]*)'));
      return m ? decodeURIComponent(m[1]) : null;
    }

    async function checkAdminAuth() {
      const statusEl = document.getElementById('admin-auth-status');
      const adminCookie = getCookie('admin_logged_in');
      if (adminCookie === 'true') {
        statusEl.style.display = 'flex';
        statusEl.className = 'status-badge status-ready';
        statusEl.innerHTML = '<span>✅</span> Already authorized. Redirecting...';
        redirectBack();
      }
    }

    function redirectBack() {
      const urlParams = new URLSearchParams(window.location.search);
      const redirect = urlParams.get('redirect');
      if (redirect) {
        window.location.href = '/' + redirect;
      } else {
        window.location.href = '/index.html';
      }
    }

    async function loginAdmin() {
      const password = document.getElementById('admin-password').value.trim();
      const statusEl = document.getElementById('admin-auth-status');
      const btn = document.getElementById('btn-admin-login');
      
      if (!password) {
        statusEl.style.display = 'flex';
        statusEl.className = 'status-badge status-error';
        statusEl.innerHTML = '<span>⚠️</span> Please enter a password';
        return;
      }

      btn.classList.add('btn-loading');
      btn.querySelector('span').textContent = 'Authenticating...';
      
      statusEl.style.display = 'flex';
      statusEl.className = 'status-badge status-pending';
      statusEl.innerHTML = '<span>⏳</span> Verifying credentials...';

      try {
        const res = await fetch((window.API_BASE || '') + '/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password })
        });
        const data = await res.json();
        
        btn.classList.remove('btn-loading');
        btn.querySelector('span').textContent = 'Sign In';

        if (res.ok && data.success) {
          statusEl.className = 'status-badge status-ready';
          statusEl.innerHTML = '<span>✅</span> Access Granted! Redirecting...';
          
          if (window.SiteAuth && typeof window.applyAdminStatus === 'function') {
             window.applyAdminStatus(true);
          }
          
          setTimeout(redirectBack, 800);
        } else {
          statusEl.className = 'status-badge status-error';
          statusEl.innerHTML = '<span>❌</span> ' + (data.error || 'Authentication failed');
        }
      } catch (err) {
        btn.classList.remove('btn-loading');
        btn.querySelector('span').textContent = 'Sign In';
        statusEl.className = 'status-badge status-error';
        statusEl.innerHTML = '<span>❌</span> Connection error. Please try again.';
      }
    }

    checkAdminAuth();
  </script>
</body>
</html>
